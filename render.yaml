# Render "Blueprint": tells Render how to build and run SupplyWatch.
# One free web service: Python serves both the API and the built React page.
services:
  - type: web
    name: supplywatch
    runtime: python
    plan: free
    # Install Python packages, then build the React page into frontend/dist.
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    # Render tells us which port to use through $PORT.
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    # Render checks this address to know the app started correctly.
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: NODE_VERSION
        value: "22"
      - key: SUPPLYWATCH_MODE
        value: live   # real data snapshot in data/live (refresh_live.py); no API key needed
      # The key that signs login cookies. Render makes up a long random value once
      # and keeps it secret; it never appears in the code.
      - key: SESSION_SECRET
        generateValue: true
      # Render serves the site over https, so login cookies are marked "Secure"
      # (the browser only sends them over an encrypted connection).
      - key: COOKIE_SECURE
        value: "1"
