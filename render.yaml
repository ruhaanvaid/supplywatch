# Render "Blueprint": tells Render how to build and run SupplyWatch.
# One free web service (Python serves both the API and the built React page)
# plus one free Postgres database that keeps the user accounts.
services:
  - type: web
    name: supplywatch
    runtime: python
    plan: free
    # Install Python packages, then build the React page into frontend/dist.
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    # Render tells us which port to use through $PORT.
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    # Render checks this address to know the app started correctly.
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: NODE_VERSION
        value: "22"
      - key: SUPPLYWATCH_MODE
        value: live   # real data snapshot in data/live (refresh_live.py); no API key needed
      # The key that signs login cookies. Render makes up a long random value once
      # and keeps it secret; it never appears in the code.
      - key: SESSION_SECRET
        generateValue: true
      # Render serves the site over https, so login cookies are marked "Secure"
      # (the browser only sends them over an encrypted connection).
      - key: COOKIE_SECURE
        value: "1"
      # The public address, used for the links inside emails.
      - key: SITE_URL
        value: https://supplywatch-ys1u.onrender.com
      # Where user accounts are stored. Render fills this in with the database
      # below's private address and password, so no password is ever written here.
      - key: DATABASE_URL
        fromDatabase:
          name: supplywatch-db
          property: connectionString
      # BREVO_API_KEY and MAIL_FROM (for sending emails) are secrets, so they are
      # added by hand in Render's dashboard (Environment), never in this file.

# The accounts database. It's separate from the web server, so accounts survive
# restarts (the free web server wipes its own disk every time it restarts).
# Free plan limits: 1 GB, no backups, and it EXPIRES 30 days after it's created
# (then 14 days to upgrade before Render deletes it).
databases:
  - name: supplywatch-db
    plan: free
    databaseName: supplywatch
    user: supplywatch
